name: Bootstrap Unity project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-project:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy Unity project from existing project repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dewy-source
          git clone --depth 1 https://github.com/pure-alone/Dewy-Water-Journey-Unity.git /tmp/dewy-source
          rm -rf Assets Packages ProjectSettings
          cp -a /tmp/dewy-source/Assets ./Assets
          cp -a /tmp/dewy-source/Packages ./Packages
          cp -a /tmp/dewy-source/ProjectSettings ./ProjectSettings
          cp /tmp/dewy-source/.gitignore ./.gitignore
          rm -f AUDIO_SHA256.txt

      - name: Commit Unity project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets Packages ProjectSettings .gitignore
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "feat: add complete Unity WebGL project"
          git push origin HEAD:main
