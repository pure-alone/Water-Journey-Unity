name: Verify Unity project structure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity project structure without inspecting audio content
        shell: bash
        run: |
          set -euo pipefail

          test -f ProjectSettings/ProjectVersion.txt
          grep -q '6000.3.15f1' ProjectSettings/ProjectVersion.txt

          test -f Assets/Scenes/Main.unity
          test -f Assets/Scripts/DewyApp.cs
          test -f Assets/Scripts/DewyPages.cs
          test -f Assets/Scripts/DewyAudio.cs
          test -f Assets/Scripts/DewyBootstrap.cs
          test -f Assets/Editor/DewyBuild.cs
          test -f Assets/WebGLTemplates/Dewy/index.html

          grep -q 'defaultWebScreenWidth = 450' Assets/Editor/DewyBuild.cs
          grep -q 'defaultWebScreenHeight = 900' Assets/Editor/DewyBuild.cs
          grep -q 'Assets/Scenes/Main.unity' Assets/Editor/DewyBuild.cs

          for page in Home Scene1 Scene2 Scene3 Scene4 Scene5 Scene6 Credits; do
            grep -q "$page" Assets/Scripts/DewyApp.cs Assets/Scripts/DewyPages.cs
          done

          expected=(
            bubble.mp3 cloud_workshop.mp3 credits_theme.mp3 evaporation.mp3
            forest_complete.mp3 home_theme.mp3 journey_complete.mp3 mountain_stream.mp3
            rain.mp3 rainy_forest.mp3 river_ocean.mp3 sparkle.mp3 stream_splash.mp3
            sunny_ocean.mp3 ui_click.mp3 underground.mp3 underground_drip.mp3 water_drop.mp3
          )

          test "$(find Assets/Resources/Audio -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 18
          for name in "${expected[@]}"; do
            test -f "Assets/Resources/Audio/$name"
          done

          test ! -f AUDIO_SHA256.txt
          echo 'Unity structure OK; 18 audio filenames present. Audio contents were not inspected.'
